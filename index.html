<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-title" content="ページスキャン">
<title>ページスキャン</title>
<style>
/* Layout: full-screen viewfinder on top, control deck at the bottom like a camera app */
:root{
  --bg:#0e0f11; --deck:#17191d; --line:#2a2d33;
  --fg:#f3f2ee; --muted:#9a9ea6; --accent:#ffd34d; --danger:#ff6b6b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--fg);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stage{position:relative;flex:1;min-height:0;background:#000;
  padding-top:env(safe-area-inset-top,0px)}
video{width:100%;height:100%;object-fit:contain;display:block}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .3s}
.flash.on{opacity:.75;transition:none}
.res{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;
  font-size:12px;color:var(--muted);background:rgba(0,0,0,.5);padding:2px 8px;border-radius:4px;
  font-variant-numeric:tabular-nums}

.intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:24px 16px;text-align:center;background:var(--bg)}
.intro h1{margin:0;font-size:22px;letter-spacing:.04em}
.intro p{margin:0;color:var(--muted);max-width:30em}
.intro .err{color:var(--danger)}
.primary{background:var(--accent);color:#1a1600;border:0;border-radius:999px;padding:12px 28px;font-weight:700}

.deck{background:var(--deck);border-top:1px solid var(--line);
  padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:10px}
.tray{display:flex;gap:8px;overflow-x:auto;min-height:60px;align-items:center;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.tray .empty{color:var(--muted);font-size:13px}
.thumb{flex:0 0 auto;height:60px;width:auto;border-radius:6px;border:2px solid transparent;padding:0;background:none}
.thumb img{height:56px;display:block;border-radius:4px}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.side{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 10px;font-size:13px}
.side:disabled{opacity:.35;cursor:default}
.left{justify-self:start}.right{justify-self:end}
.shutter{width:74px;height:74px;border-radius:50%;border:4px solid var(--fg);background:transparent;padding:4px}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:var(--fg);transition:transform .1s}
.shutter:active span{transform:scale(.88)}
.shutter:disabled{opacity:.3}

.viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);display:flex;flex-direction:column;z-index:10;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.viewer .imgwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .hint{color:var(--muted);font-size:12px;text-align:center;margin:8px 0}
.viewer .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.viewer .row button{border:1px solid var(--line);background:var(--deck);border-radius:10px;padding:10px 16px}
.viewer .row .go{background:var(--accent);color:#1a1600;border:0;font-weight:700}
.viewer .row .del{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--deck);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20}
@media (prefers-reduced-motion:reduce){.flash,.shutter span{transition:none}}
</style>
</head>
<body>

<div class="stage">
  <video id="video" playsinline muted autoplay></video>
  <div class="flash" id="flash"></div>
  <div class="res" id="res" hidden></div>
  <div class="intro" id="intro">
    <h1>ページスキャン</h1>
    <p>参考書のページを撮って、そのままAIアプリに送れます。撮った写真はこのページを閉じると消えます。</p>
    <button class="primary" id="startBtn">はじめる</button>
    <p class="err" id="err" hidden></p>
  </div>
</div>

<div class="deck">
  <div class="tray" id="tray"><span class="empty">撮った写真がここに並びます。タップで拡大・共有</span></div>
  <div class="controls">
    <button class="side left" id="clearBtn" disabled>全部消す</button>
    <button class="shutter" id="shutter" aria-label="撮影" disabled><span></span></button>
    <button class="side right" id="shareAllBtn" disabled>まとめて共有</button>
  </div>
</div>

<div class="viewer" id="viewer" hidden>
  <div class="imgwrap"><img id="viewImg" alt="撮影した写真"></div>
  <p class="hint" id="viewHint">共有ボタンでClaudeなどのアプリに直接送れます。画像を長押しして保存もできます。</p>
  <div class="row">
    <button id="closeBtn">閉じる</button>
    <button class="del" id="delBtn">削除</button>
    <button class="go" id="shareOneBtn">共有</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), flash = $('flash'), tray = $('tray');
  const shots = []; // {blob, url, name}
  let current = -1, wakeLock = null;

  function toast(msg){
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }

  async function start(){
    const err = $('err'); err.hidden = true;
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia){
      err.textContent = 'このページは https:// のURLで開く必要があります（ファイルを直接開くとカメラが使えません）。';
      err.hidden = false; return;
    }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{ facingMode:{ideal:'environment'}, width:{ideal:3840}, height:{ideal:2160} }
      });
      video.srcObject = stream;
      await video.play();
      $('intro').hidden = true;
      $('shutter').disabled = false;
      const s = () => { $('res').textContent = video.videoWidth + '×' + video.videoHeight; $('res').hidden = false; };
      if (video.videoWidth) s(); else video.addEventListener('loadedmetadata', s, {once:true});
      try{ wakeLock = await navigator.wakeLock?.request('screen'); }catch(e){}
    }catch(e){
      err.textContent = e.name === 'NotAllowedError'
        ? 'カメラの使用が許可されませんでした。ブラウザの設定でこのサイトのカメラを許可してください。'
        : 'カメラを起動できませんでした（' + e.name + '）。';
      err.hidden = false;
    }
  }

  function capture(){
    const w = video.videoWidth, h = video.videoHeight;
    if (!w) return;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(video, 0, 0, w, h);
    flash.classList.add('on');
    requestAnimationFrame(() => requestAnimationFrame(() => flash.classList.remove('on')));
    c.toBlob(blob => {
      if (!blob) return;
      const d = new Date(), p = n => String(n).padStart(2,'0');
      const name = `page_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}_${shots.length+1}.jpg`;
      shots.push({blob, url:URL.createObjectURL(blob), name});
      render();
      tray.scrollLeft = tray.scrollWidth;
    }, 'image/jpeg', 0.9);
  }

  function render(){
    tray.textContent = '';
    if (!shots.length){
      const s = document.createElement('span'); s.className = 'empty';
      s.textContent = '撮った写真がここに並びます。タップで拡大・共有';
      tray.appendChild(s);
    }
    shots.forEach((sh, i) => {
      const b = document.createElement('button');
      b.className = 'thumb'; b.setAttribute('aria-label', (i+1) + '枚目を開く');
      const img = document.createElement('img'); img.src = sh.url; img.alt = '';
      b.appendChild(img); b.onclick = () => openViewer(i);
      tray.appendChild(b);
    });
    $('clearBtn').disabled = !shots.length;
    $('shareAllBtn').disabled = !shots.length;
    $('shareAllBtn').textContent = shots.length > 1 ? `まとめて共有（${shots.length}）` : 'まとめて共有';
  }

  async function share(list){
    const files = list.map(s => new File([s.blob], s.name, {type:'image/jpeg'}));
    if (navigator.canShare && navigator.canShare({files})){
      try{ await navigator.share({files}); }
      catch(e){ if (e.name !== 'AbortError') toast('共有できませんでした'); }
    }else{
      toast('このブラウザは共有に未対応です。拡大して長押しで保存してください');
      if (list.length) openViewer(shots.indexOf(list[0]));
    }
  }

  function openViewer(i){
    current = i; $('viewImg').src = shots[i].url; $('viewer').hidden = false;
  }
  function closeViewer(){ $('viewer').hidden = true; current = -1; }

  $('startBtn').onclick = start;
  $('shutter').onclick = capture;
  $('shareAllBtn').onclick = () => share(shots.slice());
  $('shareOneBtn').onclick = () => current >= 0 && share([shots[current]]);
  $('closeBtn').onclick = closeViewer;
  $('delBtn').onclick = () => {
    if (current < 0) return;
    URL.revokeObjectURL(shots[current].url);
    shots.splice(current, 1); closeViewer(); render();
  };
  let clearArmed = false;
  $('clearBtn').onclick = () => {
    if (!clearArmed){
      clearArmed = true; $('clearBtn').textContent = 'もう一度で消去';
      setTimeout(() => { clearArmed = false; $('clearBtn').textContent = '全部消す'; }, 2500);
      return;
    }
    shots.forEach(s => URL.revokeObjectURL(s.url));
    shots.length = 0; clearArmed = false; $('clearBtn').textContent = '全部消す'; render();
  };
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && video.srcObject && (!wakeLock || wakeLock.released)){
      try{ wakeLock = await navigator.wakeLock?.request('screen'); }catch(e){}
    }
  });
})();
</script>
</body>
</html>
